name: DevSync Daily Repository Update

on:
  schedule:
    # Runs daily at 10:30 UTC (change if you want)
    - cron: '30 10 * * *'
  workflow_dispatch:   # allows manual trigger

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 23f3001285@ds.study.iitm.ac.in - Generate daily update
        run: |
          echo "Last updated on $(date -u)" > daily-log.txt

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add daily-log.txt
          git commit -m "Automated daily update $(date -u)" || echo "No changes to commit"
          git push
